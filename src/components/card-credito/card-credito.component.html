<div class="flex justify-start items-center pt-20">
    <div
      class="w-full max-w-sm bg-white border border-gray-200 rounded-lg shadow-sm dark:bg-gray-800 dark:border-gray-700 p-2"
    >
      <div class="flex items-center gap-3 pb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 fill-white" viewBox="0 0 576 512"><!--!Font Awesome Free 6.7.2 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2025 Fonticons, Inc.--><path d="M512 80c8.8 0 16 7.2 16 16l0 32L48 128l0-32c0-8.8 7.2-16 16-16l448 0zm16 144l0 192c0 8.8-7.2 16-16 16L64 432c-8.8 0-16-7.2-16-16l0-192 480 0zM64 32C28.7 32 0 60.7 0 96L0 416c0 35.3 28.7 64 64 64l448 0c35.3 0 64-28.7 64-64l0-320c0-35.3-28.7-64-64-64L64 32zm56 304c-13.3 0-24 10.7-24 24s10.7 24 24 24l48 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-48 0zm128 0c-13.3 0-24 10.7-24 24s10.7 24 24 24l112 0c13.3 0 24-10.7 24-24s-10.7-24-24-24l-112 0z"/></svg>        <h2 class="text-white">Cartão de Crédito</h2>
      </div>
      <div class="bg-white p-4 rounded shadow-lg flex flex-col gap-2">
        <div class="bg-white p-4 rounded shadow-lg flex flex-col gap-2">

            <!-- Número do Cartão e Bandeira -->
            <div class="flex justify-between text-zinc-800 font-bold pb-2">
              <p>{{ cartaoCredito.numero }}</p>
              <p>{{ cartaoCredito.bandeira }}</p>
            </div>
          
            <!-- Nome do Titular -->
            <div class="text-zinc-800 font-bold pb-2">
              <p>{{ cartaoCredito.nome }}</p>
            </div>
          
            <!-- Lista de Limites -->
            <div *ngFor="let item of cartaoCredito.limites" 
                 class="flex justify-between text-zinc-800 border-b-gray-950 border-b-2 pb-2">
              <p>{{ item.tipo }}</p>
              <p>R$ {{ item.valor.toFixed(2) }}</p>
            </div>
            
          </div>
          
      </div>
      
    </div>
  </div>
